# Keeps the Odoo source submodule and the GitHub Actions versions up to date
version: 2

updates:
  - package-ecosystem: gitsubmodule
    directory: /
    target-branch: "19.0"
    schedule:
      interval: daily
      time: "02:00"
      timezone: America/Detroit
    groups:
      sources:
        patterns:
          - "*"
    commit-message:
      prefix: "Odoo"
    open-pull-requests-limit: 2
    # Dependabot applies a 3 day cooldown by default; take updates as soon as they land
    cooldown:
      default-days: 0

  - package-ecosystem: gitsubmodule
    directory: /
    target-branch: "20.0"
    schedule:
      interval: daily
      time: "02:00"
      timezone: America/Detroit
    groups:
      sources:
        patterns:
          - "*"
    commit-message:
      prefix: "Odoo"
    open-pull-requests-limit: 2
    # Dependabot applies a 3 day cooldown by default; take updates as soon as they land
    cooldown:
      default-days: 0

  - package-ecosystem: gitsubmodule
    directory: /
    target-branch: "18.0"
    schedule:
      interval: daily
      time: "02:00"
      timezone: America/Detroit
    groups:
      sources:
        patterns:
          - "*"
    commit-message:
      prefix: "Odoo"
    open-pull-requests-limit: 2
    # Dependabot applies a 3 day cooldown by default; take updates as soon as they land
    cooldown:
      default-days: 0

  - package-ecosystem: github-actions
    directory: /
    target-branch: "19.0"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    # Dependabot applies a 3 day cooldown by default; take updates as soon as they land
    cooldown:
      default-days: 0
