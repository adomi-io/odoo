name: Docker

on:
  workflow_dispatch:
    inputs:
      odoo_version:
        description: 'Odoo branch/tag to build (e.g., 19.0)'
        required: false
        default: '19.0'
      odoo_repository:
        description: 'Odoo git repository to clone (e.g., https://github.com/odoo/odoo.git)'
        required: false
        default: 'https://github.com/odoo/odoo.git'
      image_tag:
        description: 'Optional: override the Docker tag (defaults to the selected Odoo version)'
        required: false
        default: ''
      target_platforms:
        description: 'Target platforms for buildx (e.g., linux/amd64,linux/arm64)'
        required: false
        default: 'linux/amd64'
      skip_unit_tests:
        description: 'Skip unit tests when building this image'
        type: boolean
        default: true
  schedule:
    - cron: '38 3 * * *'
  push:
    branches:
      - "19.0"
    paths:
      - '**'
      - '!README.md'

env:
  REGISTRY: ghcr.io
  REGISTRY_USERNAME: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
  IMAGE_NAME: ${{ github.repository }}
  ODOO_VERSION: 19.0
  ODOO_REPOSITORY: https://github.com/odoo/odoo.git
  SKIP_UNIT_TESTS: 'true' # Default for scheduled/push builds; can be overridden for workflow_dispatch.
  TARGET_PLATFORMS: linux/amd64

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    concurrency:
      group: docker-${{ inputs.odoo_version || env.ODOO_VERSION }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write

    env:
      ODOO_VERSION: ${{ inputs.odoo_version || env.ODOO_VERSION }}
      ODOO_REPOSITORY: ${{ inputs.odoo_repository || env.ODOO_REPOSITORY }}
      IMAGE_TAG: ${{ inputs.image_tag || '' }}
      TARGET_PLATFORMS: ${{ inputs.target_platforms || env.TARGET_PLATFORMS }}
      # Always expose as a string so the `if:` comparisons keep working.
      SKIP_UNIT_TESTS: >-
        ${{
          github.event_name == 'workflow_dispatch'
            && (inputs.skip_unit_tests && 'true' || 'false')
            || env.SKIP_UNIT_TESTS
        }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for testing
        id: build
        if: env.SKIP_UNIT_TESTS != 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./src
          build-args: |
            ODOO_VERSION=${{ env.ODOO_VERSION }}
            ODOO_REPOSITORY=${{ env.ODOO_REPOSITORY }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.ODOO_VERSION }}-test
          push: false
          load: true
          cache-to: type=gha,mode=max

      - name: Run unit tests
        working-directory: tests
        if: env.SKIP_UNIT_TESTS != 'true'
        env:
          TESTS_IMAGE_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.ODOO_VERSION }}-test
          SKIP_BUILD: true
        run: ./unit-tests.sh

      - name: Log into registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME}}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Extract Docker metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG != '' && env.IMAGE_TAG || env.ODOO_VERSION }},enable=true

      - name: Build and push multi-arch Docker image
        if: github.event_name != 'pull_request'
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: ./src
          platforms: ${{ env.TARGET_PLATFORMS }}
          build-args: |
            ODOO_VERSION=${{ env.ODOO_VERSION }}
            ODOO_REPOSITORY=${{ env.ODOO_REPOSITORY }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
