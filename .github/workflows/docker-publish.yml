name: Docker

on:
  workflow_dispatch:
    inputs:
      odoo_version:
        description: 'Odoo branch/tag to build (e.g., 19.0)'
        required: false
        default: '19.0'
      odoo_repository:
        description: 'Odoo git repository to clone (e.g., https://github.com/odoo/odoo.git)'
        required: false
        default: 'https://github.com/odoo/odoo.git'
      image_tag:
        description: 'Optional: override the Docker tag (defaults to the selected Odoo version)'
        required: false
        default: ''
      target_platforms:
        description: 'Target platforms for buildx (e.g., linux/amd64,linux/arm64)'
        required: false
        default: 'linux/amd64'
      skip_unit_tests:
        description: 'Skip unit tests when building this image'
        type: boolean
        default: true

  schedule:
    - cron: '38 3 * * *'

  push:
    branches:
      - "19.0"
    paths:
      - '**'
      - '!README.md'
      - '!get-started/**'
      - '!get-started'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    concurrency:
      group: docker-${{ inputs.odoo_version || '19.0' }}
      cancel-in-progress: true

    permissions:
      contents: read
      packages: write

    env:
      ODOO_VERSION: ${{ inputs.odoo_version || '19.0' }}
      ODOO_REPOSITORY: ${{ inputs.odoo_repository || 'https://github.com/odoo/odoo.git' }}
      IMAGE_TAG: ${{ inputs.image_tag || '' }}
      TARGET_PLATFORMS: ${{ inputs.target_platforms || 'linux/amd64,linux/arm64' }}
      SKIP_UNIT_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_unit_tests || false }}
      TEST_IMAGE_TAG: ghcr.io/${{ github.repository }}:${{ inputs.image_tag != '' && inputs.image_tag || inputs.odoo_version || '19.0' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG != '' && env.IMAGE_TAG || env.ODOO_VERSION }},enable=true

      - name: Build image for unit tests
        if: ${{ env.SKIP_UNIT_TESTS != 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: ./src
          platforms: linux/amd64
          build-args: |
            ODOO_VERSION=${{ env.ODOO_VERSION }}
            ODOO_REPOSITORY=${{ env.ODOO_REPOSITORY }}
          tags: ${{ env.TEST_IMAGE_TAG }}
          load: true

      - name: Run unit tests
        if: ${{ env.SKIP_UNIT_TESTS != 'true' }}
        working-directory: tests
        env:
          TESTS_IMAGE_TAG: ${{ env.TEST_IMAGE_TAG }}
          SKIP_BUILD: true
        run: ./unit-tests.sh

      - name: Log into registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch Docker image
        if: github.event_name != 'pull_request'
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: ./src
          platforms: ${{ env.TARGET_PLATFORMS }}
          build-args: |
            ODOO_VERSION=${{ env.ODOO_VERSION }}
            ODOO_REPOSITORY=${{ env.ODOO_REPOSITORY }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true