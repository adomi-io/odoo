name: Docker

on:
  workflow_dispatch:
    inputs:
      odoo_version:
        description: 'Odoo version to build (defaults to the branch you run it from)'
        required: false
        default: ''
      image_tag:
        description: 'Optional: override the Docker tag (defaults to the selected Odoo version)'
        required: false
        default: ''
      target_platforms:
        description: 'Target platforms for buildx (e.g., linux/amd64,linux/arm64)'
        required: false
        default: 'linux/amd64'
      skip_unit_tests:
        description: 'Skip unit tests when building this image'
        type: boolean
        default: true

  schedule:
    - cron: '38 3 * * *'

  push:
    branches:
      - "18.0"
      - "19.0"
      - "20.0"
    paths:
      - '**'
      - '!README.md'
      - '!get-started/**'
      - '!get-started'

  pull_request:
    branches:
      - "18.0"
      - "19.0"
      - "20.0"
    paths:
      - '**'
      - '!README.md'
      - '!get-started/**'
      - '!get-started'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest

    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
      platforms: ${{ steps.matrix.outputs.platforms }}

    steps:
      # A dispatch builds what you picked, a pull request builds amd64 for its base branch,
      # a push builds the version of its branch, the nightly run builds every version
      - name: Choose the versions and platforms
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
          INPUT_VERSION: ${{ inputs.odoo_version }}
          INPUT_PLATFORMS: ${{ inputs.target_platforms }}
        run: |
          case "$EVENT_NAME" in
            workflow_dispatch)
              versions="${INPUT_VERSION:-$REF_NAME}"
              platforms="${INPUT_PLATFORMS:-linux/amd64,linux/arm64}"
              ;;
            pull_request)
              versions="$BASE_REF"
              platforms="linux/amd64"
              ;;
            push)
              versions="$REF_NAME"
              platforms="linux/amd64,linux/arm64"
              ;;
            *)
              versions="18.0,19.0,20.0"
              platforms="linux/amd64,linux/arm64"
              ;;
          esac

          to_json() {
            jq -cR 'split(",") | map(gsub("\\s"; "")) | map(select(. != ""))' <<< "$1"
          }

          echo "versions=$(to_json "$versions")" >> "$GITHUB_OUTPUT"
          echo "platforms=$(to_json "$platforms")" >> "$GITHUB_OUTPUT"

  # Run on native hardware
  build:
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    needs: prepare

    strategy:
      fail-fast: false
      matrix:
        odoo_version: ${{ fromJSON(needs.prepare.outputs.versions) }}
        platform: ${{ fromJSON(needs.prepare.outputs.platforms) }}

    concurrency:
      group: docker-${{ matrix.odoo_version }}-${{ matrix.platform }}-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
      cancel-in-progress: true

    permissions:
      contents: read
      packages: write

    env:
      ODOO_VERSION: ${{ matrix.odoo_version }}
      IMAGE_TAG: ${{ inputs.image_tag || '' }}
      SKIP_UNIT_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_unit_tests || false }}
      TEST_IMAGE_TAG: ghcr.io/${{ github.repository }}:${{ inputs.image_tag != '' && inputs.image_tag || matrix.odoo_version }}
      PLATFORM_PAIR: ${{ matrix.platform == 'linux/arm64' && 'linux-arm64' || 'linux-amd64' }}
      CACHE_REF: ghcr.io/${{ github.repository }}:cache-${{ matrix.odoo_version }}-${{ matrix.platform == 'linux/arm64' && 'linux-arm64' || 'linux-amd64' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The nightly run builds each Odoo version from the branch of the same name
          ref: ${{ github.event_name == 'schedule' && matrix.odoo_version || github.ref }}
          submodules: true

      - name: Read the Odoo commit
        id: odoo
        run: echo "sha=$(git -C src/odoo rev-parse --short=12 HEAD 2>/dev/null || echo branch)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG != '' && env.IMAGE_TAG || env.ODOO_VERSION }},enable=true
            type=raw,value=${{ env.ODOO_VERSION }}-{{date 'YYYY-MM-DD'}},enable=${{ env.IMAGE_TAG == '' }}
            type=raw,value=${{ env.ODOO_VERSION }}-${{ steps.odoo.outputs.sha }},enable=${{ env.IMAGE_TAG == '' }}

      - name: Log into registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Unit tests run on amd64 only, a pull request can only read the cache
      - name: Build image for unit tests
        if: ${{ matrix.platform == 'linux/amd64' && env.SKIP_UNIT_TESTS != 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: ./src
          platforms: ${{ matrix.platform }}
          tags: ${{ env.TEST_IMAGE_TAG }}
          load: true
          cache-from: type=registry,ref=${{ env.CACHE_REF }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0},mode=max', env.CACHE_REF) || '' }}

      - name: Run unit tests
        if: ${{ matrix.platform == 'linux/amd64' && env.SKIP_UNIT_TESTS != 'true' }}
        working-directory: tests
        env:
          TESTS_IMAGE_TAG: ${{ env.TEST_IMAGE_TAG }}
          TESTS_SKIP_BUILD: true
        run: ./unit-tests.sh

      - name: Build and push by digest
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./src
          platforms: ${{ matrix.platform }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.CACHE_REF }}
          cache-to: type=registry,ref=${{ env.CACHE_REF }},mode=max

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.odoo_version }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins the digests of each platform into one manifest under the tags
  publish:
    runs-on: ubuntu-latest

    needs:
      - prepare
      - build

    if: github.event_name != 'pull_request'

    strategy:
      fail-fast: false
      matrix:
        odoo_version: ${{ fromJSON(needs.prepare.outputs.versions) }}

    concurrency:
      group: docker-publish-${{ matrix.odoo_version }}-release
      cancel-in-progress: true

    permissions:
      contents: read
      packages: write

    env:
      ODOO_VERSION: ${{ matrix.odoo_version }}
      IMAGE_TAG: ${{ inputs.image_tag || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && matrix.odoo_version || github.ref }}

      - name: Read the Odoo commit
        id: odoo
        run: echo "sha=$(git rev-parse --short=12 HEAD:src/odoo 2>/dev/null || echo branch)" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.odoo_version }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG != '' && env.IMAGE_TAG || env.ODOO_VERSION }},enable=true
            type=raw,value=${{ env.ODOO_VERSION }}-{{date 'YYYY-MM-DD'}},enable=${{ env.IMAGE_TAG == '' }}
            type=raw,value=${{ env.ODOO_VERSION }}-${{ steps.odoo.outputs.sha }},enable=${{ env.IMAGE_TAG == '' }}

      - name: Log into registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags=()
          while IFS= read -r tag; do
            tags+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")

          sources=()
          for digest in *; do
            sources+=("${REGISTRY}/${IMAGE_NAME}@sha256:${digest}")
          done

          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Inspect the published image
        run: docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${{ steps.meta.outputs.version }}"
